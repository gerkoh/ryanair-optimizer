<select name="origin" id="origin" 
        hx-post="/api/update-session-vars" 
        hx-include="#search-form *" 
        hx-trigger="change"
        hx-swap="none">
  {% for airport in airports %}
  <option {% if origin == airport.Code %} selected {% endif %} value="{{ airport.Code }}">{{ airport.Code }} - {{ airport.Name }}</option>
  {% endfor %}
</select>
<script>
document.getElementById('origin').addEventListener('htmx:afterRequest', function(evt) {
  // First trigger reload of destination options
  document.body.dispatchEvent(new Event('originChanged'));
  // Wait a bit for destination to reload, then trigger search update
  setTimeout(function() {
    document.body.dispatchEvent(new Event('formUpdated'));
  }, 100);
});
</script>
